[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxim"
version = "0.1.0"
description = "Narrated explainer and lesson videos from ManimGX animations, an offline voice and optional screen recordings."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "manimgx>=0.1.1",
  "kokoro-onnx>=0.4",
  "soundfile",
  "numpy",
  "pillow",
  "scipy",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
screen = ["playwright"]

[project.scripts]
voxim = "voxim.cli:main"

[tool.setuptools]
packages = ["voxim"]

[tool.setuptools.package-data]
voxim = ["fonts/*", "templates/*/*"]
